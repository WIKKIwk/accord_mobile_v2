<!doctype html>
<html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>State rulonlari · isolated QA</title>
<style>
body{margin:0;padding:12px;background:#eef1ed;font:13px system-ui;color:#30423c;display:grid;justify-items:center;gap:10px}
nav{display:flex;flex-wrap:wrap;gap:8px}button{padding:9px;border:1px solid #adbbb1;border-radius:9px;background:white;cursor:pointer}
#demo{position:relative;width:min(1100px,95vw);height:78vh;border-radius:18px;overflow:hidden;background:#daddd7}
canvas{width:100%;height:100%;display:block;touch-action:none}p{margin:0}#stats{font-variant-numeric:tabular-nums}
</style>
<p>TEST · Sun’iy state qoldiqlari, haqiqiy ERP ma’lumoti o‘zgarmaydi.</p>
<nav><button id="arrival">State ga 12 rulon</button><button id="mount">1 rulon taqildi</button><button id="empty">State bo‘sh</button><button id="dense">120 rulon</button><button id="stale">Aloqa uzildi</button><button id="reset">Umumiy ko‘rinish</button><button id="phone">Telefon / keng ekran</button></nav>
<div id="demo" data-model-viewer-state="{}">
<canvas data-factory-map-canvas data-model-src="../../assets/models/zavod6-clay.glb"></canvas>
<div data-factory-map-status>Model yuklanmoqda…</div><div data-factory-map-bridge hidden></div>
</div><div id="stats"></div>
<script type="module">
import { mountFactoryMap } from '../../third_party/model_viewer_plus/assets/factory-map-renderer.js?v=20260907stock2';
const demo = document.querySelector('#demo'), canvas = demo.querySelector('canvas');
const ids = ['node:1:instance:0','node:18:instance:3','node:3:instance:0','node:6:instance:6','node:6:instance:7','node:18:instance:0','node:18:instance:2','node:7','node:20'];
const names = ['Bosma 7','Bosma 8','Bosma 9','Laminatsiya 2','Laminatsiya 1','Flexo','Holodniy kley','Extruder','Rezka'];
const state = {enabled:true,showLabels:true,resetRevision:0,
  live:{fresh:true,validUntil:Date.now()+3600000,unknownLabel:'TEST',connections:[],machines:ids.map((objectId,i)=>({objectId,name:names[i],state:'idle',statusLabel:'TEST · buyurtmasiz',orderLabel:''}))},
  stock:{fresh:true,validUntil:Date.now()+3600000,rollLabel:'rulon',unknownLabel:'State qoldig‘i tasdiqlanmagan',piles:[]}};
function publish(){demo.setAttribute('data-model-viewer-state',JSON.stringify(state));demo.dispatchEvent(new Event('model-viewer-state'));}
function inventory(count){state.stock.fresh=true;state.stock.validUntil=Date.now()+3600000;
  state.stock.piles=ids.map((objectId,i)=>({stateId:`state-${i}`,name:`${names[i]} oldi`,objectIds:[objectId],count,rollIds:Array.from({length:count},(_,j)=>`roll-${i}-${j}`)}));publish();}
document.querySelector('#arrival').onclick=()=>inventory(12);
document.querySelector('#mount').onclick=()=>{state.stock.piles.forEach(p=>{p.rollIds.pop();p.count=p.rollIds.length;});publish();};
document.querySelector('#empty').onclick=()=>inventory(0);
document.querySelector('#dense').onclick=()=>inventory(120);
document.querySelector('#stale').onclick=()=>{state.stock.validUntil=0;publish();};
document.querySelector('#reset').onclick=()=>{state.resetRevision++;state.focusedObjectId='';publish();};
document.querySelector('#phone').onclick=()=>{demo.style.width=demo.style.width?'':'390px';};
demo.addEventListener('model-viewer-plus-message',event=>{
  const message=JSON.parse(event.target.getAttribute('data-model-viewer-message'));
  if(message.type==='object_tap'){state.focusedObjectId=message.objectId;publish();}
});
setInterval(()=>document.querySelector('#stats').textContent=`${canvas.dataset.stockRollCount||0} rulon · ${canvas.dataset.stockPileCount||0} uyum · joy topilmagan: ${canvas.dataset.stockUnplacedCount||0} · ${canvas.dataset.drawCalls||0} calls · ${canvas.dataset.renderCount||0} frames`,500);
inventory(12);mountFactoryMap();
</script></html>
