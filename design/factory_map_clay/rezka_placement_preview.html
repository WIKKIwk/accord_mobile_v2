<!doctype html>
<html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 ta rezka — haqiqiy map modeli</title>
<style>body{margin:0;background:#daddd7;color:#273936;font:14px system-ui}header{position:absolute;z-index:2;top:14px;left:16px;background:#fffE;padding:12px 18px;border-radius:12px}h1{font-size:18px;margin:0 0 5px}button{padding:7px 12px;margin:5px 5px 0 0;cursor:pointer}canvas{display:block;width:100vw;height:100vh}#status{font-size:12px}</style>
<header><h1>5 ta rezka · 2 ta devor bo‘ylab, 3 ta ichki qatorda</h1><div>App ichidagi haqiqiy GLB · ERP ma’lumotlari o‘zgarmaydi</div><button id="angle">Qiya ko‘rinish</button><button id="top">Tepadan</button><div id="status">Yuklanmoqda…</div></header>
<canvas></canvas>
<script type="module">
import * as T from '../../third_party/model_viewer_plus/assets/three.module.js';
import {GLTFLoader} from '../../third_party/model_viewer_plus/assets/GLTFLoader.js';
import {OrbitControls} from '../../third_party/model_viewer_plus/assets/OrbitControls.js';
import {cleanFactoryMapGeometry,FACTORY_MAP_CLUTTER_BASE_IDS} from '../../third_party/model_viewer_plus/assets/factory-map-scene-policy.js';
import {optimizeStaticMap} from '../../third_party/model_viewer_plus/assets/factory-map-performance.js';
const scene=new T.Scene();scene.background=new T.Color('#daddd7');
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,180);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(28,0,37);controls.maxPolarAngle=Math.PI*.47;controls.enableDamping=true;
scene.add(new T.HemisphereLight(0xf7fafc,0x7d8790,2));const sun=new T.DirectionalLight(0xfff4e6,2.5);sun.position.set(18,35,28);sun.target.position.set(28,0,38);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24});sun.shadow.mapSize.set(2048,2048);scene.add(sun,sun.target);
const model=await new GLTFLoader().loadAsync('../../assets/models/zavod6-clay.glb?v=20260917rezka-facing-v2');
const hide=[5,9,17,32,33,40,44,45,60,61,90,91];
model.scene.traverse(o=>{if(!o.isMesh)return;let owner=o;while(owner&&!Number.isInteger(model.parser.associations.get(owner)?.nodes))owner=owner.parent;const n=model.parser.associations.get(owner)?.nodes;const prim=model.parser.associations.get(o)?.primitives;const id=`node:${n}${owner!==o?`:primitive:${prim}`:''}`;cleanFactoryMapGeometry(o,id);if(hide.includes(n)||FACTORY_MAP_CLUTTER_BASE_IDS.includes(id)||o.userData.factory_map_hidden)o.visible=false;if(n===30)for(const i of [9,23,37,51,65,79,93,107])o.setMatrixAt(i,new T.Matrix4().makeScale(0,0,0));o.castShadow=true;o.receiveShadow=true;});
optimizeStaticMap(model.scene);
scene.add(model.scene);
function angle(){camera.up.set(0,1,0);camera.position.set(10,25,22);controls.target.set(28,0,37);controls.update();}
document.querySelector('#angle').onclick=angle;
document.querySelector('#top').onclick=()=>{camera.up.set(0,0,-1);camera.position.set(28,34,37.01);controls.target.set(28,0,37);controls.update();};
const ray=new T.Raycaster(),pointer=new T.Vector2();
renderer.domElement.addEventListener('click',event=>{pointer.set(event.clientX/innerWidth*2-1,1-event.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);const visible=[];model.scene.traverseVisible(o=>{if(o.isMesh)visible.push(o);});const hit=ray.intersectObjects(visible,false)[0];let owner=hit?.object;while(owner&&!owner.userData.factory_map_object_id)owner=owner.parent;document.querySelector('#status').textContent=owner?`${owner.userData.factory_map_label} · ${owner.userData.factory_map_object_id}`:'Bo‘sh joy / devor';});
angle();document.querySelector('#status').textContent='5 ta yangi rezka yuklandi · aylantirish va tanlash mumkin';
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
